version: 1
name: "Sam Kim - Social Feed Digest"
audience: "AI builders and investors, sports fans, Asia-economy and private-markets watchers."

x_search:
  window_hours: 48          # look-back window for X and web/news sweeps
  handles: []               # named voices to watch; seed over time (xAI allows max 20)
  candidate_topics: 8       # candidates requested from the model before ranking

reddit:
  subreddits:
    - LLMDevs
    - ArtificialInteligence
    - AI_developers
  limit: 25

portfolio:
  enabled: true
  # One batched sweep per day (1-3 searches covering the whole list), folded into that day's digests.
  watchlist:
    - Bridge Opportunity Zone Fund V
    - American Securities
    - AlpInvest
    - Ares Senior Direct Lending
    - General Catalyst
    - Digital Bridge
    - Starwood Fund XIII
    - Dragoneer
    - 8V
