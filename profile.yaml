    - Fun-Gi
    - Phoenix Technologies
    - Contra
    - Saronic
    - SpaceX
    - Altra Venture Opportunity Fund I
    - Quadrillion
    - Mercury Financial
    - neo4j
    - Together.ai

linkedin:
  # Watched input location (relative to the data dir). Bright writes items here on
  # Sam's request. The server never reads LinkedIn on its own.
  inbox: inbox/linkedin

drafting:
  tone: "neutral, sharp, specific; plain declarative sentences"
  voice_samples: []          # approved/edited comments land here; profile reviewed after two weeks
  dos:
    - reference the specific source, number, or claim
    - short, declarative, no hedging
    - one idea per comment
  donts:
    - no hype words (game-changing, revolutionary, mind-blowing)
    - no hashtag stacks or emoji
    - no unsolicited financial advice

post_ideas:
  per_channel: 4             # 3-5 per channel
  channels: [x, linkedin, reddit]

rank:
  min_topics: 5
  max_topics: 8

cost:
  per_run_budget_usd: 0.25   # hard acceptance cap for external API cost per full run

delivery:
  # Eventual target. Interim (until the Resend account email changes or a domain
  # is verified): set DIGEST_EMAIL_TO=samislucid98@gmail.com, which overrides this.
  email_to: samjookim@gmail.com
  email_subject_prefix: "[Feed Digest]"

retention_days: 30

