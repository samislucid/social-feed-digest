# Topic profile for the Social Feed Digest worker.
# Seeded from the Topic Profile doc (app://documents/doc_Tto7fGR2lAEImXpV), Sam Kim, September 2026.
# Edit freely: changes take effect on the next run with no code changes.
version: 1
name: "Sam Kim - Social Feed Digest"
audience: "AI builders and investors, sports fans, Asia-economy and private-markets watchers."

x_search:
  window_hours: 48          # look-back window for X and web/news sweeps
  handles: []               # named voices to watch; seed over time (xAI allows max 20)
  candidate_topics: 8       # candidates requested from the model before ranking

reddit:
  # Token costs / LLM economics is covered on Reddit through these existing
  # sources: the token-costs niche keywords rank cost posts from them. A new
  # subreddit (e.g. r/LocalLLaMA) is only worth adding if coverage proves thin,
  # since anonymous RSS already 429s intermittently and every source trades
  # against run duration.
  subreddits:
    - LLMDevs
    - ArtificialInteligence
    - AI_developers
  limit: 25
  # Reddit cap: at most this many Reddit posts appear in the whole digest,
  # best-ranked first. Reddit was overweighting the digest (2026-09-07 review).
  max_digest_posts: 5

portfolio:
  enabled: true
  # One batched sweep per day (1-3 searches covering the whole list), folded into that day's digests.
  watchlist:
    - Bridge Opportunity Zone Fund V
    - American Securities
    - AlpInvest
    - Ares Senior Direct Lending
    - General Catalyst
    - Digital Bridge
    - Starwood Fund XIII
    - Dragoneer
    - 8V
    - Statera
    - Sanctor
    - Khosla Ventures
    - Lighspeed Ventures
    - Allocate Opportunity Fund
    - Fun-Gi
    - Phoenix Technologies
    - Contra
    - Saronic
    - SpaceX
    - Altra Venture Opportunity Fund I
    - Quadrillion
    - Mercury Financial
    - neo4j
    - Together.ai

linkedin:
  # Watched input location (relative to the data dir). Bright writes items here on
  # Sam's request. The server never reads LinkedIn on its own.
  inbox: inbox/linkedin

drafting:
  tone: "neutral, sharp, specific; plain declarative sentences"
  voice_samples: []          # approved/edited comments land here; profile reviewed after two weeks
  dos:
    - ground every comment in the post's own text: build on or answer a concrete claim from it
    - short, declarative, no hedging
    - one idea per comment
    - sound like a real reply Sam would actually post on that specific thread
  donts:
    - no hype words (game-changing, revolutionary, mind-blowing)
    - no hashtag stacks or emoji
    - no unsolicited financial advice
    - no generic engagement bait ('great post', 'interesting take')
    - no post ideas that restate one article, retitle a single story, or propose link shares
    - no Brightstack pitches in threads where it does not genuinely fit

# Sam's writing goal, consumed by digest/draft.py _build_prompt as drafting
# context: suggested comments and post ideas on the focus topic should be
# substantive and accurate enough to inform Sam's own writing.
writing:
  focus_topic: >-
    Token costs and LLM economics: cost comparisons across LLMs, agents,
    harnesses, and applications.
  why: >-
    Sam's X account is "the token furnace"; he is building a detailed
    understanding of token costs and writes about this topic on X.
  quality_bar: >-
    Suggested comments and post ideas on LLM cost comparisons must be
    substantive and accurate enough to inform Sam's writing: concrete numbers
    and real prices from the source posts, assumptions stated; never invent
    figures.

# Brightstack positioning + voice, consumed by digest/draft.py _build_prompt.
# Short by design: light product relevance in AI-workflow threads, never promo.
brightstack:
  name: Brightstack
  one_liner: >-
    Brightstack is an AI-native workspace with a full team of agents - PM,
    researcher, engineer, QA and more - so work moves from research to review in
    one place with full context, instead of bouncing between Notion, Linear,
    Slack and GitHub.
  audience: >-
    Technically fluent PMs and operators who use AI to do work that used to
    need engineers.
  flows: [Research, Spec, Implementation, Review, Iteration]
  voice:
    register: "senior practitioner talking to peers; concrete, understated, plain sentences"
    when_to_mention: >-
      the thread is genuinely about AI workflows, coding agents, or AI changing
      how teams build and ship; at most one light, relevant mention per comment
    never: >-
      promo spam, 'check out our product', hype words, or pitching Brightstack
      into threads where it does not fit

rank:
  min_topics: 5
  # High enough that every channel section has surface: X and LinkedIn posts,
  # the capped Reddit block (see reddit.max_digest_posts), and web/news context.
  max_topics: 12

cost:
  per_run_budget_usd: 0.25   # hard acceptance cap for external API cost per full run

delivery:
  # Permanent recipient: Sam's Resend account owner address. Resend's no-domain
  # constraint (sends only to the account owner, From must be onboarding@resend.dev)
  # is satisfied by design here, so no domain verification is ever needed.
  email_to: samislucid98@gmail.com
  email_subject_prefix: "[Feed Digest]"

retention_days: 30

niches:
  - id: token-costs
    label: Token costs and LLM economics
    weight: 1.5
    priority: high   # scanned every run: scout must return token-cost candidates when signal exists
    keywords: [token cost, per-token price, API pricing, LLM pricing, model pricing,
               cost comparison, cost per token, inference cost, token spend,
               LLM economics, price cut, price drop]
  - id: ai-core
    label: Core AI
    weight: 1.5
    keywords: [AI, LLM, GPT, Grok, Claude, Gemini, open model, open-weights, frontier model,
               dev tools, coding agent, copilot, fine-tune, inference, benchmark,
               context window, RAG, agent, foundation model, eval]
  - id: ai-business
    label: AI in business functions
    weight: 1.0
    keywords: [AI productivity, productivity tool, finance team, marketing automation,
               workflow automation, enterprise AI, ops, rollout, back office]
  - id: sports
    label: Sports
    weight: 1.0
    keywords: [49ers, NFL, football, La Liga, soccer, footballer, Korean,
               Champions League, NBA, MLB, transfer, quarterback]
  - id: asian-economics
    label: Asian economics
    weight: 1.0
    keywords: [Korea, Korean, Japan, Japanese, China, Chinese, won, yen, yuan,
               Bank of Korea, BOJ, PBOC, semiconductor, export, tariff]
  - id: markets
    label: Software, tech and venture markets
    weight: 1.0
    keywords: [SaaS, valuation, venture, secondaries, funding, Series A, Series B, Series C,
               IPO, acquisition, M&A, ARR, private markets, software market]
