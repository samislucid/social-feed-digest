[project]
name = "social-feed-digest"
version = "0.1.0"
description = "Twice-daily social feed digest: X trends via xAI Live Search, Reddit via RSS (PRAW-ready), ranked topics, claude -p drafting, email + private page delivery."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
praw = ["praw>=7.7"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
